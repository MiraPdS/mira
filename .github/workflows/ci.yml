name: CI

# Gate de calidad de cada Pull Request y de cada push a main y develop. Un push
# a main con CI verde, ademas, despliega (job "Desplegar").
#
# GitHub Actions es el CI/CD oficial del proyecto desde la Entrega 2 (D14):
# secretos, environment `deploy` y como recrear todo en docs/ci-cd.md.
#
# Los nombres de los jobs ("Lint, tipos y pruebas" y "Build") son los checks
# obligatorios de la proteccion de main: si se renombran, la proteccion queda
# esperando un check que nunca llega y ningun PR se puede fusionar.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# En main no se cancela: cancelar un run no detiene el deploy que ya disparo en
# Render o Vercel. Sus runs van en serie; si se acumulan, GitHub deja solo el
# mas reciente en espera.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Explicito para no depender del ajuste por defecto del repositorio (que hoy
# tambien es solo lectura). Un job que necesite mas lo pide en su propio bloque.
permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  calidad:
    name: Lint, tipos y pruebas
    runs-on: ubuntu-latest

    services:
      # Postgres efimero para la suite de integracion. Es el mismo motor que
      # se usa en local (postgres:16) para que no haya sorpresas entre
      # "funciona en mi maquina" y CI.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mira
          POSTGRES_PASSWORD: mira
          POSTGRES_DB: mira_test
        ports:
          - 5443:5432
        options: >-
          --health-cmd "pg_isready -U mira -d mira_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://mira:mira@localhost:5443/mira_test?schema=public
      DATABASE_URL: postgresql://mira:mira@localhost:5443/mira_test?schema=public
      DIRECT_URL: postgresql://mira:mira@localhost:5443/mira_test?schema=public
      JWT_SECRET: secreto-de-integracion-continua-suficientemente-largo
      BCRYPT_ROUNDS: '4'
      CORS_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npm run db:generate -w @mira/api

      - name: Formato
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Migrar base de pruebas
        run: npm run db:deploy -w @mira/api

      - name: Pruebas con cobertura
        # El reporter JSON deja los resultados por archivo dentro de coverage/,
        # para que viajen en el mismo artefacto. De ahi los lee
        # `npm run wiki:evidencias` al congelar la evidencia de una entrega.
        run: npm run test:coverage -- --reporter=default --reporter=json --outputFile.json=coverage/test-results.json

      - name: Publicar reporte de cobertura
        # Se sube siempre, incluso si las pruebas fallaron: el reporte del
        # fallo suele ser mas util que el del exito.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
          # El maximo en repos publicos. Aun asi expira: la evidencia de cada
          # entrega se congela en la Wiki (scripts/wiki-evidencias.mjs).
          retention-days: 90

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run db:generate -w @mira/api
      - name: Compilar web y api
        run: npm run build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          VITE_API_URL: http://localhost:3000/api

  # Un job posterior (aviso de MIR-53) se engancha con `needs: deploy`,
  # `if: always()` y leyendo `needs.deploy.result`.
  deploy:
    name: Desplegar
    runs-on: ubuntu-latest
    needs: [calidad, build]
    # En un PR o en develop el job queda Skipped. El environment refuerza lo
    # mismo: solo acepta main y guarda los dos deploy hooks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: deploy
    # Mas que la suma de los pasos: el rojo lo da el tope del health, con su
    # mensaje, no este limite.
    timeout-minutes: 25
    env:
      HEALTH_URL: https://mira-pds.vercel.app/api/health
      ESPERA_INICIAL_S: '180'
      INTERVALO_S: '15'
      TOPE_S: '900'
    steps:
      # Como en main los runs ya no se cancelan, uno puede llegar aqui con un
      # commit mas nuevo en main, aun sin CI. El hook de Vercel construye la
      # punta de main: sin esta guarda publicaria ese commit. Tambien frena
      # re-ejecutar un run viejo, que desalinearia Render y Vercel.
      - name: Confirmar que el commit sigue siendo la punta de main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          punta=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$punta" != "$GITHUB_SHA" ]; then
            echo "::error::main avanzo a $punta: no se despliega $GITHUB_SHA. Despliega el run de la punta."
            exit 1
          fi

      # Los secretos entran por env y no se imprime la respuesta: el log nunca
      # muestra una URL de hook. No usar `set -x` en estos pasos.
      - name: Disparar despliegue de la API en Render
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        # `ref` fija el commit que paso el CI. Va primero para que un hook
        # rechazado frene a Vercel; si Render lo acepta y su build falla, el
        # frontend igual sale.
        run: |
          curl --fail --silent --show-error --max-time 30 --output /dev/null \
            --get --data-urlencode "ref=$GITHUB_SHA" "$DEPLOY_HOOK_URL"
          echo "Render acepto el despliegue de $GITHUB_SHA"

      - name: Disparar despliegue del frontend en Vercel
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        # El hook de Vercel no acepta commit: construye la punta de main.
        run: |
          curl --fail --silent --show-error --max-time 30 --output /dev/null \
            --request POST "$DEPLOY_HOOK_URL"
          echo "Vercel acepto el despliegue de la punta de main"

      - name: Comprobar que la API responde
        # Los hooks responden antes de que el despliegue termine, de ahi los
        # reintentos. Un 200 NO prueba que salio la version nueva: la anterior
        # contesta 200 hasta que Render la reemplaza, y si el build falla sigue
        # contestando. La espera inicial da tiempo al despliegue, pero no
        # garantiza que haya terminado: el primer 200 puede venir de la version
        # anterior. Ver "Que verifica el job" en docs/ci-cd.md.
        run: |
          sleep "$ESPERA_INICIAL_S"
          limite=$((SECONDS + TOPE_S))
          intento=1
          while true; do
            estado=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --max-time 20 "$HEALTH_URL" || true)
            if [ "$estado" = "200" ]; then
              echo "::notice::La API responde 200 (intento $intento). Esto no prueba la version desplegada: confirmala en el panel de Render."
              exit 0
            fi
            echo "Intento $intento: HTTP $estado"
            if [ "$SECONDS" -ge "$limite" ]; then
              echo "::error::La API no respondio 200 en $TOPE_S s"
              exit 1
            fi
            intento=$((intento + 1))
            sleep "$INTERVALO_S"
          done
