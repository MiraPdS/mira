name: CI

# Gate de calidad de cada Pull Request y de cada push a main y develop. Un push
# a main con CI verde, ademas, despliega (job "Desplegar"). Los fallos, las
# recuperaciones y los despliegues se avisan en #mira-ci (job "Avisar en Discord").
#
# GitHub Actions es el CI/CD oficial del proyecto desde la Entrega 2 (D14):
# secretos, environment `deploy` y como recrear todo en docs/ci-cd.md.
#
# Los nombres de los jobs ("Lint, tipos y pruebas", "Build" y "E2E") son los
# checks obligatorios de la proteccion de main: si se renombran, la proteccion
# queda esperando un check que nunca llega y ningun PR se puede fusionar.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# En main no se cancela: cancelar un run no detiene el deploy que ya disparo en
# Render o Vercel. Sus runs van en serie; si se acumulan, GitHub deja solo el
# mas reciente en espera.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Explicito para no depender del ajuste por defecto del repositorio (que hoy
# tambien es solo lectura). Un job que necesite mas lo pide en su propio bloque.
permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  calidad:
    name: Lint, tipos y pruebas
    runs-on: ubuntu-latest

    services:
      # Postgres efimero para la suite de integracion. Es el mismo motor que
      # se usa en local (postgres:16) para que no haya sorpresas entre
      # "funciona en mi maquina" y CI.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mira
          POSTGRES_PASSWORD: mira
          POSTGRES_DB: mira_test
        ports:
          - 5443:5432
        options: >-
          --health-cmd "pg_isready -U mira -d mira_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://mira:mira@localhost:5443/mira_test?schema=public
      DATABASE_URL: postgresql://mira:mira@localhost:5443/mira_test?schema=public
      DIRECT_URL: postgresql://mira:mira@localhost:5443/mira_test?schema=public
      JWT_SECRET: secreto-de-integracion-continua-suficientemente-largo
      BCRYPT_ROUNDS: '4'
      CORS_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npm run db:generate -w @mira/api

      - name: Formato
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Migrar base de pruebas
        run: npm run db:deploy -w @mira/api

      - name: Pruebas con cobertura
        # El reporter JSON deja los resultados por archivo dentro de coverage/,
        # para que viajen en el mismo artefacto. De ahi los lee
        # `npm run wiki:evidencias` al congelar la evidencia de una entrega.
        # El reporter JUnit (MIR-51) va aparte, a test-results/, porque tiene
        # su propio artefacto.
        run: >-
          npm run test:coverage --
          --reporter=default
          --reporter=json --outputFile.json=coverage/test-results.json
          --reporter=junit --outputFile.junit=test-results/junit.xml

      - name: Publicar reporte de cobertura
        # Se sube siempre, incluso si las pruebas fallaron: el reporte del
        # fallo suele ser mas util que el del exito.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: coverage/
          # El maximo en repos publicos. Aun asi expira: la evidencia de cada
          # entrega se congela en la Wiki (scripts/wiki-evidencias.mjs).
          retention-days: 90

      - name: Publicar reporte JUnit
        # Igual que la cobertura: se sube siempre. Si las pruebas fallaron, aqui
        # queda cual fallo y por que, para cada ejecucion.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-junit
          path: test-results/junit.xml
          retention-days: 90

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run db:generate -w @mira/api
      - name: Compilar web y api
        run: npm run build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          VITE_API_URL: http://localhost:3000/api

  # Pruebas de interfaz con Playwright (MIR-62). La configuracion es la de e2e/
  # (MIR-61): con CI=true, Playwright arranca la API compilada en :3100 y
  # `vite preview` en :4173, y el globalSetup resetea y siembra mira_e2e.
  # Decisiones en docs/plans/MIR-62-job-e2e-actions.md.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: build
    # Solo un respaldo: el tope real es el del paso "Pruebas E2E". Un job que
    # supera su timeout-minutes puede quedar `cancelled`, y el aviso de Discord
    # no dice nada de un cancelado.
    timeout-minutes: 20

    services:
      # Igual que en `calidad`, pero con la base propia de los E2E. El
      # globalSetup solo resetea bases *_e2e.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mira
          POSTGRES_PASSWORD: mira
          POSTGRES_DB: mira_e2e
        ports:
          - 5443:5432
        options: >-
          --health-cmd "pg_isready -U mira -d mira_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Es el valor por defecto de e2e/entorno.ts; va explicito para que se lea aqui.
      E2E_DATABASE_URL: postgresql://mira:mira@localhost:5443/mira_e2e?schema=public
      JWT_SECRET: secreto-de-integracion-continua-suficientemente-largo
      BCRYPT_ROUNDS: '4'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npm run db:generate -w @mira/api

      # Los jobs no comparten archivos, y `Build` compila la web con
      # VITE_API_URL hacia :3000. Aqui va SIN VITE_API_URL: el bundle llama a
      # /api relativo y el proxy de `vite preview` lo lleva a la API de E2E.
      - name: Compilar web y api
        run: npm run build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      # Solo el headless shell de chromium: los proyectos `chromium` y `mobile`
      # corren headless. Sin cache: restaurarla tarda casi lo mismo que bajarlo,
      # y las dependencias de apt se instalan igual.
      - name: Instalar chromium
        run: npx -w @mira/e2e playwright install --with-deps --only-shell chromium

      - name: Pruebas E2E
        # Un paso que se pasa de tiempo falla, y el job queda `failure`: asi el
        # aviso dice "fallo E2E" tambien si un servidor se cuelga. La suite
        # tarda unos minutos.
        timeout-minutes: 10
        run: npm run test:e2e

      # Los reportes se suben siempre; la evidencia de fallos (traces,
      # screenshots y videos) solo existe si un test fallo.
      - name: Publicar reporte HTML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-e2e
          path: e2e/playwright-report/
          retention-days: 90

      - name: Publicar reporte JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-junit-e2e
          path: e2e/reportes/junit-e2e.xml
          retention-days: 90

      - name: Publicar evidencia de fallos
        # Si lo que fallo fue el build o el arranque, no hay traces: no avisa.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: evidencia-fallos-e2e
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 90

  deploy:
    name: Desplegar
    runs-on: ubuntu-latest
    needs: [calidad, build, e2e]
    # En un PR o en develop el job queda Skipped. El environment refuerza lo
    # mismo: solo acepta main y guarda los dos deploy hooks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: deploy
    # Mas que la suma de los pasos: el rojo lo da el tope del health (20 min),
    # con su mensaje, no este limite.
    timeout-minutes: 25
    env:
      HEALTH_URL: https://mira-pds.vercel.app/api/health
      INTERVALO_S: '15'
      TOPE_S: '1200'
    steps:
      # Como en main los runs ya no se cancelan, uno puede llegar aqui con un
      # commit mas nuevo en main, aun sin CI. El hook de Vercel construye la
      # punta de main: sin esta guarda publicaria ese commit. Tambien frena
      # re-ejecutar un run viejo, que desalinearia Render y Vercel.
      - name: Confirmar que el commit sigue siendo la punta de main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          punta=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$punta" != "$GITHUB_SHA" ]; then
            echo "::error::main avanzo a $punta: no se despliega $GITHUB_SHA. Despliega el run de la punta."
            exit 1
          fi

      # Los secretos entran por env y no se imprime la respuesta: el log nunca
      # muestra una URL de hook. No usar `set -x` en estos pasos.
      - name: Disparar despliegue de la API en Render
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        # `ref` fija el commit que paso el CI. Va primero para que un hook
        # rechazado frene a Vercel; si Render lo acepta y su build falla, el
        # frontend igual sale.
        run: |
          curl --fail --silent --show-error --max-time 30 --output /dev/null \
            --get --data-urlencode "ref=$GITHUB_SHA" "$DEPLOY_HOOK_URL"
          echo "Render acepto el despliegue de $GITHUB_SHA"

      - name: Disparar despliegue del frontend en Vercel
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        # El hook de Vercel no acepta commit: construye la punta de main.
        run: |
          curl --fail --silent --show-error --max-time 30 --output /dev/null \
            --request POST "$DEPLOY_HOOK_URL"
          echo "Vercel acepto el despliegue de la punta de main"

      - name: Comprobar que la API corre el commit desplegado
        # Los hooks responden antes de que el despliegue termine, de ahi los
        # reintentos. /api/health informa `commit` (RENDER_GIT_COMMIT, MIR-71):
        # la version anterior contesta 200 con su propio commit hasta que
        # Render la reemplaza, y si el build falla sigue contestando, asi que
        # solo un 200 con commit == GITHUB_SHA da verde. Sin espera inicial: un
        # 200 viejo ya no engana. El commit es el de Render: que Vercel termino
        # su build se ve en su panel. Ver "Que verifica el job" en docs/ci-cd.md.
        run: |
          esperado_corto=${GITHUB_SHA:0:7}
          limite=$((SECONDS + TOPE_S))
          intento=1
          while true; do
            # El codigo HTTP va en la ultima linea, despues del cuerpo. Sin
            # conexion curl escribe 000; un cuerpo que no es JSON deja commit
            # vacio. No se imprime el cuerpo.
            respuesta=$(curl --silent --max-time 20 --write-out '\n%{http_code}' \
              "$HEALTH_URL" || true)
            estado=${respuesta##*$'\n'}
            estado=${estado:-000}
            cuerpo=${respuesta%$'\n'*}
            commit=$(printf '%s' "$cuerpo" | jq -r '.commit // empty' 2>/dev/null || true)
            if [ "$estado" = "200" ] && [ "$commit" = "$GITHUB_SHA" ]; then
              echo "::notice::La API corre $GITHUB_SHA (intento $intento)"
              exit 0
            fi
            if [ "$estado" = "200" ]; then
              if [ -n "$commit" ]; then mostrado=${commit:0:7}; else mostrado='sin informar'; fi
              echo "Intento $intento: HTTP 200, commit $mostrado (se espera $esperado_corto)"
            else
              echo "Intento $intento: HTTP $estado"
            fi
            if [ "$SECONDS" -ge "$limite" ]; then
              if [ "$estado" != "200" ]; then
                echo "::error::La API no respondio 200 en $((TOPE_S / 60)) min"
              elif [ -z "$commit" ]; then
                echo "::error::La API responde pero no informa su commit (falta RENDER_GIT_COMMIT?)"
              else
                echo "::error::La API sigue en $commit tras $((TOPE_S / 60)) min: el despliegue de Render no termino o fallo. Revisa el panel de Render"
              fi
              exit 1
            fi
            intento=$((intento + 1))
            sleep "$INTERVALO_S"
          done

  # Corre siempre, tambien con un job en rojo. No hereda el environment `deploy`:
  # el secreto es de repositorio porque avisa tambien en PR y en develop. Los
  # casos estan en "Notificaciones", en docs/ci-cd.md.
  notify:
    name: Avisar en Discord
    runs-on: ubuntu-latest
    needs: [calidad, build, e2e, deploy]
    if: always()
    timeout-minutes: 5
    steps:
      # Todo dato del evento entra por env y el JSON lo arma jq: un nombre de
      # rama no puede inyectar comandos ni romper el mensaje. No usar `set -x`.
      - name: Avisar en mira-ci
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          CALIDAD: ${{ needs.calidad.result }}
          BUILD: ${{ needs.build.result }}
          E2E: ${{ needs.e2e.result }}
          DEPLOY: ${{ needs.deploy.result }}
          # En un PR, ref_name es "<n>/merge" y github.sha el merge de prueba:
          # el aviso muestra la rama y el commit que escribio la persona.
          RAMA: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          AUTOR: ${{ github.event.head_commit.author.name || github.actor }}
        run: |
          # Un PR desde un fork no recibe secretos. No es un fallo del pipeline.
          if [ -z "$NOTIFY_WEBHOOK_URL" ]; then
            echo "::notice::Sin NOTIFY_WEBHOOK_URL en esta ejecucion: no se avisa."
            exit 0
          fi

          # Un run o intento cancelado no dice nada, por eso se salta. Re-ejecutar
          # un run conserva su id: primero cuentan sus intentos anteriores. Despues,
          # el ultimo run de esta rama, este evento y este repositorio: develop
          # tiene runs de push y del PR de release, y un fork puede tener una rama
          # con el mismo nombre. Devuelve 1 si GitHub no responde.
          conclusion_anterior() {
            local n conclusion
            for ((n = GITHUB_RUN_ATTEMPT - 1; n >= 1; n--)); do
              conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$n" \
                --jq .conclusion) || return 1
              if [ "$conclusion" != "cancelled" ]; then
                echo "$conclusion"
                return 0
              fi
            done
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f branch="$RAMA" -f event="$GITHUB_EVENT_NAME" -f status=completed -f per_page=30 \
              --jq "[.workflow_runs[] | select(.id < $GITHUB_RUN_ID and .conclusion != \"cancelled\" and .head_repository.full_name == \"$GITHUB_REPOSITORY\")][0].conclusion"
          }

          aviso=""
          if [ "$CALIDAD" = "failure" ]; then
            aviso="🔴 **Pipeline en rojo:** falló \`Lint, tipos y pruebas\`"
          elif [ "$BUILD" = "failure" ]; then
            aviso="🔴 **Pipeline en rojo:** falló \`Build\`"
          elif [ "$E2E" = "failure" ]; then
            aviso="🔴 **Pipeline en rojo:** falló \`E2E\`"$'\n'"Traces y videos en el artefacto \`evidencia-fallos-e2e\` de la ejecución."
          elif [ "$CALIDAD" = "success" ] && [ "$BUILD" = "success" ] && [ "$E2E" = "success" ]; then
            case "$DEPLOY" in
              success) aviso="🚀 **Despliegue terminado:** la API responde. Confirma la versión en el panel de Render." ;;
              failure) aviso="🔴 **Despliegue fallido**" ;;
              cancelled) aviso="⚠️ **Despliegue cancelado:** puede haber quedado a medias." ;;
            esac

            if [ "$DEPLOY" = "success" ] || [ "$DEPLOY" = "skipped" ]; then
              # Sin esta lectura el aviso de recuperacion no se puede decidir:
              # queda advertencia, y lo demas del aviso sigue su curso.
              if anterior=$(conclusion_anterior); then
                echo "Ejecucion anterior: ${anterior:-ninguna}"
                if [ "$anterior" = "failure" ]; then
                  salto=$'\n'
                  aviso="🟢 **El pipeline volvió a pasar**${aviso:+$salto$aviso}"
                fi
              else
                echo "::warning::No se pudo leer la ejecucion anterior: si esta se recupero de un fallo, no se aviso."
              fi
            fi
          fi

          # Sin aviso: todo verde sin cambios, o un run cancelado por uno mas
          # nuevo de la misma rama.
          if [ -z "$aviso" ]; then
            echo "Nada que avisar (calidad=$CALIDAD, build=$BUILD, e2e=$E2E, deploy=$DEPLOY)"
            exit 0
          fi

          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          mensaje="$aviso
          Rama: \`$RAMA\` · Commit: [\`${COMMIT:0:7}\`](<$base/commit/$COMMIT>) · Autor: $AUTOR
          [Ver ejecución](<$base/actions/runs/$GITHUB_RUN_ID>)"

          # parse: [] evita que una rama llamada "@everyone" mencione al canal.
          # Un aviso que no sale deja advertencia y no pone rojo el run: el
          # codigo esta bien, y el run siguiente anunciaria una recuperacion falsa.
          if jq --null-input --arg content "$mensaje" \
            '{content: $content, allowed_mentions: {parse: []}}' |
            curl --fail --silent --show-error --max-time 30 --retry 3 --output /dev/null \
              --header 'Content-Type: application/json' --data @- "$NOTIFY_WEBHOOK_URL"; then
            echo "Aviso enviado a mira-ci"
          else
            echo "::warning::No se pudo enviar el aviso a Discord. Revisa NOTIFY_WEBHOOK_URL."
          fi
