name: CI

# Gate de calidad de la Entrega 1.
#
# En la Entrega 2 Jenkins asume el rol de CI/CD oficial (build + deploy +
# notificaciones a Slack). Este workflow se mantiene como verificacion rapida
# de Pull Request, que es lo que permite exigir "check verde" en la proteccion
# de la rama main desde el primer dia.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  calidad:
    name: Lint, tipos y pruebas
    runs-on: ubuntu-latest

    services:
      # Postgres efimero para la suite de integracion. Es el mismo motor que
      # se usa en local (postgres:16) para que no haya sorpresas entre
      # "funciona en mi maquina" y CI.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mira
          POSTGRES_PASSWORD: mira
          POSTGRES_DB: mira_test
        ports:
          - 5443:5432
        options: >-
          --health-cmd "pg_isready -U mira -d mira_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://mira:mira@localhost:5443/mira_test?schema=public
      DATABASE_URL: postgresql://mira:mira@localhost:5443/mira_test?schema=public
      DIRECT_URL: postgresql://mira:mira@localhost:5443/mira_test?schema=public
      JWT_SECRET: secreto-de-integracion-continua-suficientemente-largo
      BCRYPT_ROUNDS: '4'
      CORS_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npm run db:generate -w @mira/api

      - name: Formato
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Migrar base de pruebas
        run: npm run db:deploy -w @mira/api

      - name: Pruebas con cobertura
        run: npm run test:coverage

      - name: Publicar reporte de cobertura
        # Se sube siempre, incluso si las pruebas fallaron: el reporte del
        # fallo suele ser mas util que el del exito.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run db:generate -w @mira/api
      - name: Compilar web y api
        run: npm run build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          VITE_API_URL: http://localhost:3000/api
