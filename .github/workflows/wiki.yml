name: Wiki

# Publica docs/wiki/ en la Wiki de GitHub (MIR-26).
#
# docs/wiki/ es la fuente de verdad: la Wiki se cambia por Pull Request, como
# el codigo, y este workflow la copia como espejo exacto (lo que se borra en el
# repo se borra en la Wiki). Una edicion hecha directo en la Wiki se pierde en
# el siguiente sync.
#
#   pull_request        verifica y arma la Wiki sin publicarla (artefacto
#                       wiki-preview + diff en el resumen del job)
#   push a develop      verifica y publica
#   workflow_dispatch   publica a mano (solo aparece cuando el workflow ya
#                       esta en main)
#
# Requisito unico: la Wiki debe existir. Si es la primera vez, crea una pagina
# cualquiera desde la UI de GitHub; el primer sync la sobrescribe.

on:
  push:
    branches: [develop]
    paths:
      - 'docs/wiki/**'
      - 'scripts/wiki.mjs'
      - '.github/workflows/wiki.yml'
  # Sin filtro de rutas: el PR de release a main debe pasar el gate de
  # pendientes aunque no toque docs/wiki/. Es barato, no instala dependencias.
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-${{ github.ref }}
  # Los push a develop se publican en orden; en un PR solo importa el ultimo.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '20'

jobs:
  verificar:
    name: Verificar Wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Reglas de forma
        run: node scripts/wiki.mjs verificar

      - name: Sin pendientes (PR de release)
        # En la Entrega 2, ajustar PENDIENTES_PERMITIDOS_EN_RELEASE en
        # scripts/wiki.mjs para que solo quede exenta Entrega-3.md.
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: node scripts/wiki.mjs verificar --release

  sincronizar:
    name: ${{ github.event_name == 'pull_request' && 'Vista previa de la Wiki' || 'Publicar Wiki' }}
    runs-on: ubuntu-latest
    needs: verificar
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Clonar la Wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"; then
            echo "::error::La Wiki de ${GITHUB_REPOSITORY} no existe todavia. Crea una pagina cualquiera desde la UI de GitHub (pestana Wiki) y vuelve a correr el workflow."
            exit 1
          fi

      - name: Armar el espejo
        run: node scripts/wiki.mjs construir "$RUNNER_TEMP/wiki"

      - name: Resumen de cambios
        working-directory: ${{ runner.temp }}/wiki
        run: |
          git add -A
          {
            echo "### Cambios en la Wiki"
            echo
            if git diff --cached --quiet; then
              echo "Sin cambios respecto de la Wiki publicada."
            else
              echo '```'
              git diff --cached --stat
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir vista previa
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: wiki-preview
          path: |
            ${{ runner.temp }}/wiki/
            !${{ runner.temp }}/wiki/.git/
          retention-days: 14

      - name: Publicar
        if: github.event_name != 'pull_request'
        working-directory: ${{ runner.temp }}/wiki
        run: |
          if git diff --cached --quiet; then
            echo "La Wiki ya esta al dia."
            exit 0
          fi
          asunto="$(git -C "$GITHUB_WORKSPACE" log -1 --format=%s)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "sync: ${GITHUB_SHA::7} ${asunto}" -m "Desde https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          git push origin HEAD
